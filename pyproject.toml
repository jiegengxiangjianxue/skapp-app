[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skapp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml", "fastapi", "uvicorn", "pydantic", "curl_cffi>=0.17", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["skapp_pkg*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
