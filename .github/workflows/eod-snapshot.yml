name: eod-snapshot

on:
  schedule:
    - cron: '35 7 * * 1-5'   # UTC 7:35 = 北京 15:35 收盘后
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eod-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml fastapi uvicorn pydantic
      - name: Fetch engine picks from stocks-ai-view
        # 生产者：qwerzxcva/stocks-ai-view 的 engine-chain.yml → scripts/build_picks_latest.py，
        # 每天 15:30 CST 起跑产 data/engine/picks_latest.json（source / asof / 带 sh、sz、bj
        # 前缀的 items），本仓只做消费；生产者的 asof 会如实写进快照的 engine_asof/stale。
        # 新产物还没落地时回落 skapp-data 旧副本并告警，不静默、也不冒充当日名单。
        run: |
          mkdir -p data/engine
          curl -fsSL -A skapp-eod/1.0 \
            "https://raw.githubusercontent.com/qwerzxcva/stocks-ai-view/main/data/engine/picks_latest.json" \
            -o data/engine/picks_latest.json \
            || { echo "::warning::stocks-ai-view 未产出 picks_latest（engine-chain 尚未跑完？），回落 skapp-data 旧副本"; \
                 curl -fsSL -A skapp-eod/1.0 \
                   "https://raw.githubusercontent.com/jiegengxiangjianxue/skapp-data/main/data/engine/picks_latest.json" \
                   -o data/engine/picks_latest.json; }
          python3 -c "import json;d=json.load(open('data/engine/picks_latest.json',encoding='utf-8'));print('engine picks asof',d.get('asof'),'| items',len(d.get('items') or []))"
      - name: Generate EOD snapshot
        run: python -m skapp_pkg.pipeline.eod_sync
        env:
          TZ: Asia/Shanghai
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync app-facing data to public skapp-data
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, urllib.request, sys
          TOK = os.environ.get("GH_TOKEN") or ""
          if not TOK:
              sys.exit("GH_PAT secret 缺失：无法写入 skapp-data，本次不产出 app 数据（不是静默成功）")
          API = "https://api.github.com"
          import glob as _glob
          FILES = ["data/search/symbols.json","data/engine/picks_latest.json",
                   "data/engine/decision.json","data/engine/engine_fusion.json",
                   "data/engine/ai_pick_v5.json","data/engine/strategy_rank.json"] \
                  + sorted(_glob.glob("data/snapshots/*.json"))
          # search index refreshed from sina full list
          import sys; sys.path.insert(0, ".")
          try:
              from skapp_pkg.datasrc.market_data import all_symbols
              syms = all_symbols()
              if syms:
                  compact = [{"s": x["symbol"], "n": x["name"]} for x in syms]
                  os.makedirs("data/search", exist_ok=True)
                  json.dump(compact, open("data/search/symbols.json","w"), ensure_ascii=False, separators=(",",":"))
          except Exception as e:
              print("search index refresh skipped:", e)
          ok = 0; failed = []
          for f in FILES:
              if not os.path.exists(f): continue
              raw = open(f,"rb").read()
              url = API + f"/repos/jiegengxiangjianxue/skapp-data/contents/{f}"
              def api(method, url, body=None):
                  data = json.dumps(body).encode() if body is not None else None
                  r = urllib.request.Request(url, data=data, method=method, headers={
                      "Authorization":"Bearer "+TOK, "Accept":"application/vnd.github+json"})
                  with urllib.request.urlopen(r, timeout=60) as resp:
                      return json.loads(resp.read() or b"{}")
              sha = None
              try:
                  sha = api("GET", url).get("sha")
              except Exception: pass
              body = {"message": "auto sync " + f, "content": base64.b64encode(raw).decode()}
              if sha: body["sha"] = sha
              try:
                  api("PUT", url, body); print("synced", f); ok += 1
              except Exception as e:
                  print("sync failed", f, e); failed.append(f)
          # 一个文件都没同步 = 硬失败（凭据/权限/接口不通）；部分失败只报 warning，不掩耳盗铃
          if not ok:
              sys.exit("sync 全部失败（%d 个文件）：凭据或权限不可用" % len(failed))
          if failed:
              print("::warning::%d 个文件同步失败: %s" % (len(failed), ", ".join(failed)))
          print("sync done: %d ok, %d failed" % (ok, len(failed)))
          PYEOF
