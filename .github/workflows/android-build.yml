name: android-build
# skapp Android 构建：GitHub 官方 Ubuntu 24.04 arm64 runner（公开仓免费）。
# 产物仅 arm64-v8a（用户要求：不要 x86）。
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 构建机用 x86_64 runner（Google 的 build-tools/aapt2 只发布 x86_64 二进制，
    # arm64 runner 上跑不了 aapt2）。
    # 产物是 Android arm64-v8a APK：本 app 纯 Kotlin/Compose、无 native 代码，
    # 与构建机架构无关；下方 splits 已限定只出 arm64-v8a。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Cache Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/android-sdk
            ~/.android
          key: android-sdk-arm-${{ runner.os }}-${{ runner.arch }}

      - name: Install Android SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Write local.properties
        run: echo "sdk.dir=$RUNNER_TEMP/android-sdk" > local.properties

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK is arm64-only
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" | grep -E "lib/" || echo "no native libs (pure Kotlin/Compose)"
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump badging "$APK" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skapp-debug-apk-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
