name: android-build
# skapp 构建 —— 按层分段构建，任何一层不过闸就不进入下一层：
#   1) engine-gate        云端算法/引擎仓（Python）编译与注册校验
#   2) analysis-gate      云端分析计算产物（市场宽度/新鲜度/清单）自检
#   3) engine-kotlin      :engine 纯 JVM 模块（算法引擎 + 分析计算），不需要 Android SDK
#   4) ui-render-gate     :app Kotlin 编译（后端 UI + 密集渲染层类型检查）
#   5) build              打包 APK（arm64-v8a only）并发布到 GitHub Release
# 产物仅 arm64-v8a（用户要求：不要 x86）。
# 出包位置：GitHub Release（tag = v<versionName>），不再上传 Actions artifact ——
#   artifact 要登录才能下载，Release 资产可直接下到手机安装。

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ui/**'
      - 'engine/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1. 云端算法/引擎/链路构建与自检（云端仓库 stocks-ai-view）──────────────
  engine-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout engine (stocks-ai-view)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-ai-view
          path: engine-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile all engine scripts
        run: |
          set -euo pipefail
          cd engine-src
          python3 -m compileall -q scripts

      - name: Import engine chain (fetchers registered)
        run: |
          set -euo pipefail
          cd engine-src
          python3 - <<'PYCODE'
          import sys
          sys.path.insert(0, "scripts")
          import collect_all_sources as cas
          total = sum(len(v) for v in cas.FETCHERS.values())
          print("fetchers registered:", total)
          assert total >= 100, "fetcher 注册数异常"
          PYCODE

      - name: Validate data artifacts schema
        run: |
          set -euo pipefail
          cd engine-src
          python3 - <<'PYCODE'
          import json, os
          for path, keys in (
              ("data/api/sources.json", ("total", "with_fetcher", "items")),
              ("data/api/sectors_health.json", ("verdict", "counts")),
          ):
              assert os.path.exists(path), f"{path} 缺失"
              d = json.load(open(path, encoding="utf-8"))
              missing = [k for k in keys if k not in d]
              assert not missing, f"{path} 缺字段 {missing}"
              print(path, "ok")
          PYCODE

  # ── 2. 分析计算层自检（纯计算脚本，不发网络请求）────────────────────────
  analysis-gate:
    needs: engine-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout engine (stocks-ai-view)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-ai-view
          path: engine-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Market breadth accumulator smoke (dry-run, no network)
        run: |
          set -euo pipefail
          cd engine-src
          python3 -m compileall -q scripts/build_market_breadth.py
          python3 scripts/build_market_breadth.py --dry-run

      - name: Analysis artifacts schema (breadth / manifest / api index)
        run: |
          set -euo pipefail
          cd engine-src
          python3 - <<'PYCODE'
          import json, os

          def load(p):
              assert os.path.exists(p), f"{p} 缺失"
              return json.load(open(p, encoding="utf-8"))

          # 每日市场宽度历史：必须是数组、按日期升序、字段齐全
          hist = load("data/market_breadth_history.json")
          assert isinstance(hist, list) and hist, "market_breadth_history 必须是非空数组"
          dates = [r["date"] for r in hist]
          assert dates == sorted(dates), "market_breadth_history 未按日期升序"
          for r in hist:
              for k in ("date", "limit_up", "limit_down", "advance", "decline", "source"):
                  assert k in r, f"market_breadth_history 缺字段 {k}"
          print("market_breadth_history ok:", len(hist), "days, last =", dates[-1])

          api = load("data/api/market_breadth.json")
          for k in ("latest", "history", "coverage", "caliber"):
              assert k in api, f"api/market_breadth.json 缺字段 {k}"
          print("api/market_breadth.json ok, coverage =", api["coverage"].get("days"))

          man = load("data/analysis_manifest.json")
          for k in ("ts", "trading_date", "groups"):
              assert k in man, f"analysis_manifest 缺字段 {k}"
          print("analysis_manifest ok, stale_count =", man.get("stale_count"))
          PYCODE

  # ── 3. :engine 纯 JVM 模块（算法引擎 + 分析计算），不需要 Android SDK ────
  engine-kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Guard - engine module must stay Android-free
        run: |
          set -euo pipefail
          if grep -rn "^import android\.\|^import androidx\." engine/src/ ; then
            echo "::error:::engine 出现 Android 依赖，已破坏「引擎可独立构建」的边界"
            exit 1
          fi
          if grep -q 'project(":ui")' engine/build.gradle.kts ; then
            echo "::error:::engine 不得依赖 :ui（依赖方向必须是 :app -> :ui -> :engine）"
            exit 1
          fi
          echo "engine module is Android-free and does not depend on :ui"

      # 守卫的判定逻辑（阈值/去重/内存分级）必须一直有断言覆盖——
      # 测试文件被删掉时 :engine:test 依然会「通过」，所以要显式把它钉住。
      - name: Guard - health core tests must stay
        run: |
          set -euo pipefail
          TEST=engine/src/test/kotlin/com/skapp/app/data/health/ProcessHealthCoreTest.kt
          CORE=engine/src/main/java/com/skapp/app/data/health/ProcessHealthCore.kt
          test -f "$TEST"
          test -f "$CORE"
          for mark in "stall threshold" "stall progression records every repeat interval" \
                      "memory levels follow warn and critical ratios" "system low memory overrides ratio"; do
            grep -q "$mark" "$TEST" || { echo "::error::健康守卫测试丢了用例：$mark"; exit 1; }
          done
          grep -q "STALL_THRESHOLD_MS" "$CORE"
          grep -q "classifyMemory" "$CORE"
          echo "health core + tests present"

      - name: Compile engine module
        run: ./gradlew :engine:compileKotlin --no-daemon --stacktrace

      # 引擎算法必须真跑一遍 fixture：只「编译通过」挡不住把权重解析成等权、
      # 或把均线空头排列读成买点这类方向性错误。
      # 其中 PerfProbeTest 是性能基线（故意只打印不断言，慢机型不误伤）：
      # 给「要不要上 Rust/NDK」提供可复核数据，见 docs/adr/0001-cloud-python-vs-ondevice-kotlin.md
      - name: Run engine algorithm tests
        run: ./gradlew :engine:test --no-daemon --stacktrace

      # org.json 越界调用守卫（vc19 真机闪退的根因就是它）。
      # :engine 用 compileOnly 的 org.json:json 编译，运行期却是 Android 内置 org.json，
      # 两者方法集不同（jar 有 toMap()，平台没有）。编译和单测都拦不住，只能看字节码。
      - name: Guard - no org.json methods missing on Android
        run: |
          set -euo pipefail
          python3 tools/org_json_api_guard.py --self-test
          python3 tools/org_json_api_guard.py engine/build/classes

  # ── 4. 后端 UI + 密集渲染层（:app Kotlin 编译，只做类型检查不打包）────────
  ui-render-gate:
    needs: [engine-kotlin, analysis-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Verify x86_64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/android-sdk
            ~/.android
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-api35-build-tools35.0.0-cmdline11076708-v1

      - name: Configure Android SDK environment
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Write local.properties
        run: echo "sdk.dir=$RUNNER_TEMP/android-sdk" > local.properties

      - name: Compile UI layer then app shell (Kotlin type check only)
        run: |
          set -euo pipefail
          # 分层编译：:ui 先单独过一遍，界面层报错不会再被包成「APK 构建失败」
          ./gradlew :ui:compileDebugKotlin --no-daemon --stacktrace
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Render layer presence check
        run: |
          set -euo pipefail
          # 密集渲染层（Canvas 图表 + 玻璃拟态）必须存在，防止被误删后「构建成功但页面没图」
          # 2026-10-27 起界面层已独立为 :ui 模块（app/ 只剩 MainActivity + 资源）
          test -f ui/src/main/java/com/skapp/app/ui/screens/StockDetailSheet.kt
          grep -q "private fun MinuteChart" ui/src/main/java/com/skapp/app/ui/screens/StockDetailSheet.kt
          grep -q "private fun KlineChart" ui/src/main/java/com/skapp/app/ui/screens/StockDetailSheet.kt
          grep -q "private fun LinkageBar" ui/src/main/java/com/skapp/app/ui/screens/StockDetailSheet.kt
          grep -q "minuteTrendRich" engine/src/main/java/com/skapp/app/data/MarketDataClient.kt
          grep -q "lastKlineSource" engine/src/main/java/com/skapp/app/data/MarketDataClient.kt
          echo "render + data layer markers ok"

      # vc19 守卫：CrashGuard 只能抓 Java 未捕获异常，ANR / 低内存被回收 / native 崩溃它看不到。
      # 这一层把「不依赖崩溃栈」的守卫钉住，防止以后被人当成死代码清掉（它平时确实很安静）。
      - name: Health guard presence check (ANR / watchdog / memory)
        run: |
          set -euo pipefail
          GUARD=ui/src/main/java/com/skapp/app/ui/HealthGuard.kt
          test -f "$GUARD"
          # 必须真的挂在启动路径上，否则文件存在也等于没装
          grep -q "HealthGuard.install" app/src/main/java/com/skapp/app/MainActivity.kt
          grep -q "HealthGuard.exportPending" app/src/main/java/com/skapp/app/MainActivity.kt
          # 两条监视通道的真实抓手：主线程心跳、native 堆、系统低内存
          grep -q "Looper.getMainLooper" "$GUARD"
          grep -q "Debug.getNativeHeapAllocatedSize" "$GUARD"
          grep -q "getMemoryInfo" "$GUARD"
          # 停顿必须由 watchdog 线程写盘（主线程此时卡着），且线程得是 daemon 不拖住退出
          grep -q "skapp-health-watchdog" "$GUARD"
          grep -q "isDaemon = true" "$GUARD"
          # 与崩溃记录隔离：前缀必须是 health_，绝不能按 crash_ 前缀导出/删除
          grep -q 'PREFIX = "health_"' "$GUARD"
          if grep -q 'PREFIX = "crash_' "$GUARD"; then
            echo "::error::健康记录用了 crash_ 前缀，会与 CrashGuard 的导出/删除通道撞车"
            exit 1
          fi
          if grep -q '"crash_last.txt"' "$GUARD"; then
            echo "::error::健康守卫对 crash_last.txt 有字面引用（红卡那份），2026-10-27 误删事故的同类风险"
            exit 1
          fi
          echo "health guard markers ok"

      # 白名单模式的 org.json 守卫：拿 android.jar 的真实方法集逐项比对 bytecode。
      # 放在这一层是因为这里 :engine / :ui / :app 三层都已编译完，能一次扫全。
      - name: Guard - org.json API surface vs android.jar
        run: |
          set -euo pipefail
          python3 tools/org_json_api_guard.py \
            --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"

  # ── 5. 打包 ───────────────────────────────────────────────────────────
  build:
    # Google 的 build-tools/aapt2 只发布 x86_64 二进制。
    # 构建机架构与 APK ABI 无关；app/build.gradle.kts 已限定只生成 arm64-v8a。
    needs: [ui-render-gate, engine-kotlin]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # 创建 / 更新 GitHub Release 需要
    steps:
      - uses: actions/checkout@v4

      - name: Verify x86_64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "${RUNNER_ARCH:-}" = "X64"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/android-sdk
            ~/.android
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-api35-build-tools35.0.0-cmdline11076708-v1

      - name: Configure Android SDK environment
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Write local.properties
        run: echo "sdk.dir=$RUNNER_TEMP/android-sdk" > local.properties

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK is arm64-only
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test "$(basename "$APK")" = "app-arm64-v8a-debug.apk"
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          BAD_LIBS="$(unzip -Z1 "$APK" | awk '/^lib\// && $0 !~ /^lib\/arm64-v8a\// { print }')"
          test -z "$BAD_LIBS"
          if unzip -Z1 "$APK" | grep -q '^lib/'; then
            unzip -Z1 "$APK" | grep '^lib/'
          else
            echo "no native libs (pure Kotlin/Compose)"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" > /tmp/apk-badging.txt
          grep -E "^(package|application-label|native-code)" /tmp/apk-badging.txt | head -5

      - name: Read version from gradle
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)"
          test -n "$VERSION" && test -n "$CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=skapp-$VERSION-vc$CODE-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (package lives here, not in artifacts)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          SRC="app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          NAME="${{ steps.ver.outputs.asset }}"
          SIZE="$(stat -c%s "$SRC")"
          cp "$SRC" "/tmp/$NAME"
          NOTES="$(printf '%s\n' \
            "skapp ${{ steps.ver.outputs.version }} (versionCode ${{ steps.ver.outputs.code }})" \
            "" \
            "- ABI: arm64-v8a only (minSdk 26)" \
            "- Built by ${{ github.workflow }} run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            "- Commit: \`$(echo "$GITHUB_SHA" | cut -c1-7)\`" \
            "- Gates passed: engine-gate -> analysis-gate -> engine-kotlin -> ui-render-gate -> build" \
            "" \
            "Install: tap **$NAME** below to download and install. versionCode increases with every release, so it installs straight over the previous version.")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists -> refresh asset"
            gh release upload "$TAG" "/tmp/$NAME" --clobber
          else
            gh release create "$TAG" "/tmp/$NAME" \
              --title "skapp ${{ steps.ver.outputs.version }} (vc${{ steps.ver.outputs.code }})" \
              --notes "$NOTES" \
              --latest
          fi
          gh release view "$TAG" --json tagName,assets \
            --jq '.tagName, (.assets[] | "\(.name)  \(.size) bytes  \(.url)")'
          echo "APK size: $SIZE bytes"
