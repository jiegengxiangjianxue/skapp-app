name: android-build
# skapp 构建 —— 一个 job 只回答一个问题。
#
# 以前 5 个 job 里塞满步骤：一次红只告诉你「这层坏了」，步骤串行、前面红后面全 skip，
# 一次运行只能问出一个问题。现在按「守卫 / 契约 / 分析 / 单测分片 / 编译 / 打包」切开：
#
#   1) guards            静态守卫：分层方向、健康核心、分析不读云端快照、渲染层存在、健康守卫存在
#   2) engine-contract   云端仓 Python 编译 + 抓取器注册 + 产物 schema + 端云版本一致
#   3) analysis-breadth  市场宽度累加器 dry-run
#   4) analysis-artifacts 分析产物 schema（breadth / manifest / api index）
#   5) engine-tests      JVM 单测按「引擎/链路」切 15 片，matrix 并行、fail-fast: false
#   6) compile           :ui 与 :app Kotlin 编译（类型检查）+ org.json 方法面守卫
#   7) package           APK（arm64-v8a only）—— 不 needs 任何人，和编译/单测并行
#   8) release           全部闸门 + package 产物就绪后才发布 GitHub Release
#
# 墙钟时间由最长的那条串行边决定，不是 job 数量。2026-10-29 步骤级实测（run 40824622806）：
#   compile 184s（其中 gradle 编译 116s）、ui-render 157s、单测最长片 132s（wiring）、
#   package 141s。原先 package 的债主 build 排在 compile 后面 → 总墙钟 325s。
#   现在 package 并行、release 只做发布 → 预计 ≈ max(184,157,132,141) + release ≈ 215s。
#
# 每片独立：红的那片就是问题所在，其余片照常给结论，不必重跑整条链。
#
# 产物仅 arm64-v8a（用户要求：不要 x86）。
# 出包位置：GitHub Release（tag = v<versionName>）。
# 注意：本仓是私有仓，Release 资产下载同样需要登录 —— 匿名访问
#   .../releases/download/<tag>/<asset> 返回 404，手机需先登录 GitHub 才能下载安装。

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ui/**'
      - 'engine/**'
      - 'engine-core/**'
      - 'engine-net/**'
      - 'engine-algo/**'
      - 'engine-runtime/**'
      - 'testdata/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    # ── 1. 静态守卫：不编译、不装 SDK，秒级给出结构结论 ─────────────────
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Guard - engine layers must stay Android-free and one-way
        run: |
          set -euo pipefail
          # 四层 + 聚合层都不能沾 Android，否则「引擎可独立构建」不成立
          if grep -rn "^import android\.\|^import androidx\." engine*/src/ ; then
            echo "::error::引擎层出现 Android 依赖，已破坏「可独立构建」的边界"
            exit 1
          fi
          if grep -q 'project(":ui")' engine*/build.gradle.kts ; then
            echo "::error::引擎层不得依赖 :ui（依赖方向必须是 :app -> :ui -> :engine）"
            exit 1
          fi
          # 依赖方向单向：core ← net ← algo ← runtime ← 聚合，反向依赖直接红
          python3 - <<'PYCODE'
          import re, pathlib, sys
          allowed = {
              "engine-core": set(),
              "engine-net": {"engine-core"},
              "engine-algo": {"engine-core", "engine-net"},
              "engine-runtime": {"engine-core", "engine-net", "engine-algo"},
              "engine": {"engine-runtime"},
          }
          bad = []
          for mod, ok in allowed.items():
              f = pathlib.Path(mod) / "build.gradle.kts"
              if not f.exists():
                  bad.append(f"{mod}: 缺 build.gradle.kts")
                  continue
              for d in re.findall(r'project\(":([a-z-]+)"\)', f.read_text()):
                  if d.startswith("engine") and d not in ok:
                      bad.append(f"{mod} 反向依赖了 :{d}（只允许 {sorted(ok) or '无'}）")
          if bad:
              print("::error::" + "；".join(bad))
              sys.exit(1)
          print("engine layers are Android-free and depend only backwards")
          PYCODE

      # 守卫的判定逻辑（阈值/去重/内存分级）必须一直有断言覆盖——
      # 测试文件被删掉时 :engine:test 依然会「通过」，所以要显式把它钉住。
      - name: Guard - health core tests must stay
        run: |
          set -euo pipefail
          TEST=engine-core/src/test/kotlin/com/skapp/app/data/health/ProcessHealthCoreTest.kt
          CORE=engine-core/src/main/java/com/skapp/app/data/health/ProcessHealthCore.kt
          test -f "$TEST"
          test -f "$CORE"
          for mark in "stall threshold" "stall progression records every repeat interval" \
                      "memory levels follow warn and critical ratios" "system low memory overrides ratio"; do
            grep -q "$mark" "$TEST" || { echo "::error::健康守卫测试丢了用例：$mark"; exit 1; }
          done
          grep -q "STALL_THRESHOLD_MS" "$CORE"
          grep -q "classifyMemory" "$CORE"
          echo "health core + tests present"

      # 数据来源守卫：分析链路只吃实时数据，云端只能经 Db 层进门（用户明确约束）。
      # 这条守卫是「不要使用快照和云端」这句话的可执行版本，放宽它等于悄悄改需求。
      - name: Guard - analysis must not read cloud snapshots
        run: python3 tools/layer_source_guard.py

      # ── 分层构建：一层一层编译/单测，哪一层坏了当场就能看出来 ──
      # 顺序就是依赖方向；前排的层不过，后面的层不用看（和本地开发节奏一致）。
      - name: Render layer presence check
        run: |
          set -euo pipefail
          # 密集渲染层（Canvas 图表 + 玻璃拟态）必须存在，防止被误删后「构建成功但页面没图」
          # 2026-10-27 起界面层已独立为 :ui 模块（app/ 只剩 MainActivity + 资源）
          # 2026-10-29 起三个图表 composable 拆到 StockDetailCharts.kt（可见性 internal）
          CHARTS=ui/src/main/java/com/skapp/app/ui/screens/StockDetailCharts.kt
          test -f ui/src/main/java/com/skapp/app/ui/screens/StockDetailSheet.kt
          test -f "$CHARTS"
          grep -q "internal fun MinuteChart" "$CHARTS"
          grep -q "internal fun KlineChart" "$CHARTS"
          grep -q "internal fun LinkageBar" "$CHARTS"
          grep -q "minuteTrendRich" engine-net/src/main/java/com/skapp/app/data/MarketDataClient.kt
          grep -q "lastKlineSource" engine-net/src/main/java/com/skapp/app/data/MarketDataClient.kt
          echo "render + data layer markers ok"

      # vc19 守卫：CrashGuard 只能抓 Java 未捕获异常，ANR / 低内存被回收 / native 崩溃它看不到。
      # 这一层把「不依赖崩溃栈」的守卫钉住，防止以后被人当成死代码清掉（它平时确实很安静）。
      - name: Health guard presence check (ANR / watchdog / memory)
        run: |
          set -euo pipefail
          GUARD=ui/src/main/java/com/skapp/app/ui/HealthGuard.kt
          test -f "$GUARD"
          # 必须真的挂在启动路径上，否则文件存在也等于没装
          grep -q "HealthGuard.install" app/src/main/java/com/skapp/app/MainActivity.kt
          grep -q "HealthGuard.exportPending" app/src/main/java/com/skapp/app/MainActivity.kt
          # 两条监视通道的真实抓手：主线程心跳、native 堆、系统低内存
          grep -q "Looper.getMainLooper" "$GUARD"
          grep -q "Debug.getNativeHeapAllocatedSize" "$GUARD"
          grep -q "getMemoryInfo" "$GUARD"
          # 停顿必须由 watchdog 线程写盘（主线程此时卡着），且线程得是 daemon 不拖住退出
          grep -q "skapp-health-watchdog" "$GUARD"
          grep -q "isDaemon = true" "$GUARD"
          # 与崩溃记录隔离：前缀必须是 health_，绝不能按 crash_ 前缀导出/删除
          grep -q 'PREFIX = "health_"' "$GUARD"
          if grep -q 'PREFIX = "crash_' "$GUARD"; then
            echo "::error::健康记录用了 crash_ 前缀，会与 CrashGuard 的导出/删除通道撞车"
            exit 1
          fi
          if grep -q '"crash_last.txt"' "$GUARD"; then
            echo "::error::健康守卫对 crash_last.txt 有字面引用（红卡那份），2026-10-27 误删事故的同类风险"
            exit 1
          fi
          echo "health guard markers ok"

      # 白名单模式的 org.json 守卫：拿 android.jar 的真实方法集逐项比对 bytecode。
      # 放在这一层是因为这里 :engine / :ui / :app 三层都已编译完，能一次扫全。

  engine-contract:
    # ── 2. 云端仓契约：Python 侧全部检查 ───────────────────────────────
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout engine (stocks-ai-view)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-ai-view
          path: engine-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile all engine scripts
        run: |
          set -euo pipefail
          cd engine-src
          python3 -m compileall -q scripts

      - name: Import engine chain (fetchers registered)
        run: |
          set -euo pipefail
          cd engine-src
          python3 - <<'PYCODE'
          import sys
          sys.path.insert(0, "scripts")
          import collect_all_sources as cas
          total = sum(len(v) for v in cas.FETCHERS.values())
          print("fetchers registered:", total)
          assert total >= 100, "fetcher 注册数异常"
          PYCODE

      - name: Validate data artifacts schema
        run: |
          set -euo pipefail
          cd engine-src
          python3 - <<'PYCODE'
          import json, os
          for path, keys in (
              ("data/api/sources.json", ("total", "with_fetcher", "items")),
              ("data/api/sectors_health.json", ("verdict", "counts")),
          ):
              assert os.path.exists(path), f"{path} 缺失"
              d = json.load(open(path, encoding="utf-8"))
              missing = [k for k in keys if k not in d]
              assert not missing, f"{path} 缺字段 {missing}"
              print(path, "ok")
          PYCODE

      # 端上按哪一版口径解释云端参数，写在 EngineManifest.kt 的 EXPECTED_VERSIONS 里。
      # 云端升版而端上没跟上时，只看云端永远发现不了 —— 这一步就是那道闸门。
      - name: Checkout app (skapp-app)
        uses: actions/checkout@v4
        with:
          path: skapp-src

      - name: Verify engine params match app expectations
        run: |
          set -euo pipefail
          cd engine-src
          python3 scripts/verify_engine_consistency.py \
            --kotlin-manifest ../skapp-src/engine-core/src/main/java/com/skapp/app/data/EngineManifest.kt

  # ── 2. 分析计算层自检（纯计算脚本，不发网络请求）────────────────────────

  analysis-breadth:
    # ── 3. 市场宽度累加器（dry-run，不联网）────────────────────────────
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout engine (stocks-ai-view)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-ai-view
          path: engine-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Market breadth accumulator smoke (dry-run, no network)
        run: |
          set -euo pipefail
          cd engine-src
          python3 -m compileall -q scripts/build_market_breadth.py
          python3 scripts/build_market_breadth.py --dry-run


  analysis-artifacts:
    # ── 4. 分析产物 schema ────────────────────────────────────────────
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout engine (stocks-ai-view)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-ai-view
          path: engine-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analysis artifacts schema (breadth / manifest / api index)
        run: |
          set -euo pipefail
          cd engine-src
          python3 - <<'PYCODE'
          import json, os

          def load(p):
              assert os.path.exists(p), f"{p} 缺失"
              return json.load(open(p, encoding="utf-8"))

          # 每日市场宽度历史：必须是数组、按日期升序、字段齐全
          hist = load("data/market_breadth_history.json")
          assert isinstance(hist, list) and hist, "market_breadth_history 必须是非空数组"
          dates = [r["date"] for r in hist]
          assert dates == sorted(dates), "market_breadth_history 未按日期升序"
          for r in hist:
              for k in ("date", "limit_up", "limit_down", "advance", "decline", "source"):
                  assert k in r, f"market_breadth_history 缺字段 {k}"
          print("market_breadth_history ok:", len(hist), "days, last =", dates[-1])

          api = load("data/api/market_breadth.json")
          for k in ("latest", "history", "coverage", "caliber"):
              assert k in api, f"api/market_breadth.json 缺字段 {k}"
          print("api/market_breadth.json ok, coverage =", api["coverage"].get("days"))

          man = load("data/analysis_manifest.json")
          for k in ("ts", "trading_date", "groups"):
              assert k in man, f"analysis_manifest 缺字段 {k}"
          print("analysis_manifest ok, stale_count =", man.get("stale_count"))
          PYCODE

  # ── 3. :engine 纯 JVM 模块（算法引擎 + 分析计算），不需要 Android SDK ────

  engine-tests:
    # ── 5. JVM 单测：按引擎/链路分 15 片，互不影响 ──────────────────────
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: engine-core, group: core, filters: '*Test' }
          - { module: engine-net, group: net, filters: '*Test' }
          - { module: engine-algo, group: canonical, filters: '*Canonical21VoteParityTest,*CanonicalEngineParityTest' }
          - { module: engine-algo, group: engines-state, filters: '*EngineV2ParityTest,*VolTargetParityTest,*EngineSurfaceRenderContractTest' }
          - { module: engine-algo, group: early-votes, filters: '*EarlyVoteParityTest' }
          - { module: engine-algo, group: price-levels, filters: '*PriceLevelParityTest,*SuperTrendTest,*IndicatorWindowTest' }
          - { module: engine-algo, group: factors, filters: '*FactorDecorrelationTest,*FactorWeightStrategyTest,*EngineWeightsTest' }
          - { module: engine-algo, group: picking, filters: '*EngineChainSelfCheckTest,*ExitPlanTest,*PositionCapTest,*ScenarioRulesTest,*LimitHistoryTest' }
          - { module: engine-algo, group: sectors-pulse, filters: '*LocalSectorsTest,*SectorAliasTest,*SectorLinkTest,*ResonanceAndPulseTest,*LivePulseTest,*PeadEventsTest' }
          - { module: engine-algo, group: render-contracts, filters: '*UiRenderContractTest,*ScreenDataContractTest,*CloudArtifactIntegrationTest' }
          - { module: engine-algo, group: perf, filters: '*PerfProbeTest' }
          - { module: engine-runtime, group: wiring, filters: '*BoardStatsWiringTest,*ChainIntegrityTest,*CloudParamsTest,*EngineFeedLiveTest,*HeartbeatPolicyTest' }
          - { module: engine-runtime, group: picks, filters: '*LocalPicksTest,*PickScoringChainTest,*SectorBoostTest' }
          - { module: engine-runtime, group: snapshot, filters: '*LocalSnapshotTest,*SnapshotStatusTest,*DayArchiveTest,*LiveExtrasTest' }
          - { module: engine-runtime, group: contracts, filters: '*ScreenDataContractRuntimeTest,*NewsCalcResolveTest' }
    name: tests / ${{ matrix.module }} / ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: "Run ${{ matrix.module }} :: ${{ matrix.group }}"
        run: |
          set -euo pipefail
          args=""
          IFS=',' read -ra FS <<< "${{ matrix.filters }}"
          for f in "${FS[@]}"; do args="$args --tests $f"; done
          echo "gradlew :${{ matrix.module }}:test$args"
          ./gradlew :${{ matrix.module }}:test $args --stacktrace

  compile:
    # ── 6. Kotlin 编译（类型检查）+ org.json 方法面守卫 ─────────────────
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify x86_64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/android-sdk
            ~/.android
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-api35-build-tools35.0.0-cmdline11076708-v1

      - name: Configure Android SDK environment
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Write local.properties
        run: echo "sdk.dir=$RUNNER_TEMP/android-sdk" > local.properties

      - name: Compile UI layer then app shell (Kotlin type check only)
        run: |
          set -euo pipefail
          # 分层编译：:ui 先单独过一遍，界面层报错不会再被包成「APK 构建失败」
          # 不关 daemon：两次 gradlew 调用复用同一个 daemon，第二次省掉整轮配置与
          # 依赖解析（原先 --no-daemon 让 116s 里的第二段再付一遍）。
          ./gradlew :ui:compileDebugKotlin --stacktrace
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Guard - no org.json methods missing on Android
        run: |
          set -euo pipefail
          python3 tools/org_json_api_guard.py --self-test
          python3 tools/org_json_api_guard.py \
            engine-core/build/classes engine-net/build/classes \
            engine-algo/build/classes engine-runtime/build/classes

  # ── 4. 后端 UI + 密集渲染层（:app Kotlin 编译，只做类型检查不打包）────────
      - name: Guard - org.json API surface vs android.jar
        run: |
          set -euo pipefail
          python3 tools/org_json_api_guard.py \
            --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"


  # ── 8. 屏渲染（Robolectric，JVM 上跑，不需要模拟器）──────────────────────
  # 这台容器是 aarch64，conscrypt 没有 linux-aarch_64 原生库，Robolectric 在自己的
  # setUpApplicationState 就抛 UnsatisfiedLinkError（与测试代码无关）；GitHub 的 runner 是
  # x86_64，原生库齐全，所以这条验证放在 CI 而不是本地。
  ui-render-robolectric:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify x86_64 runner（Robolectric 的 conscrypt 原生库只有 x86_64）
        run: |
          set -euo pipefail
          arch=$(uname -m)
          echo "arch=$arch"
          test "$arch" = "x86_64" || { echo "::error::Robolectric 需要 x86_64 runner（conscrypt 无 aarch64 原生库）"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            ~/android-sdk
          key: android-sdk-r1-${{ runner.os }}

      - name: Configure Android SDK environment
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          if [ ! -d "$SDK_ROOT/platforms/android-35" ]; then
            command -v sdkmanager >/dev/null || {
              mkdir -p "$SDK_ROOT/cmdline-tools"
              curl -sSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q /tmp/cmdline.zip -d /tmp/cmdline
              mkdir -p "$SDK_ROOT/cmdline-tools/latest"
              mv /tmp/cmdline/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
            }
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi

      - name: Write local.properties
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: Robolectric 屏渲染测试
        run: |
          set -euo pipefail
          ./gradlew :ui:testDebugUnitTest --tests "*ScreenRenderRobolectricTest*" --stacktrace

      - name: 汇总每个屏的通过情况
        if: always()
        run: |
          set -uo pipefail
          python3 - <<'PYCODE'
          import glob, re, sys
          total = failed = 0
          for f in sorted(glob.glob("ui/build/test-results/testDebugUnitTest/TEST-*.xml")):
              s = open(f, encoding="utf-8").read()
              for m in re.finditer(r'<testcase name="([^"]+)"[^>]*?(/>|>)', s):
                  name = m.group(1)
                  total += 1
                  seg = s[m.end():m.end() + 400]
                  bad = seg.lstrip().startswith("<failure") or seg.lstrip().startswith("<error")
                  failed += 1 if bad else 0
                  print(("FAIL " if bad else "PASS ") + name)
          print("screen render cases: %d, failed: %d" % (total, failed))
          sys.exit(1 if failed or total == 0 else 0)
          PYCODE

  package:
    # ── 7. 打包：只产 APK，不碰 Release ────────────────────────────────
    # 这个 job 故意不 needs 任何前置 —— 它和单测/编译完全并行。
    # 依据（run 40824622806 步骤级实测）：原 build job 141s = Setup Gradle 24s +
    # assembleDebug 67s + Post Setup Gradle 29s + 其余 ~21s，而它排在 compile(184s)
    # 之后，把总墙钟推到 325s。撞车点不在 job 内部，在「打包等编译」这条串行边上。
    # 发布是不可逆副作用（写 Release），也已经从本 job 拆出去独立成 release。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify x86_64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "${RUNNER_ARCH:-}" = "X64"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/android-sdk
            ~/.android
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-api35-build-tools35.0.0-cmdline11076708-v1

      - name: Configure Android SDK environment
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Write local.properties
        run: echo "sdk.dir=$RUNNER_TEMP/android-sdk" > local.properties

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK is arm64-only
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test "$(basename "$APK")" = "app-arm64-v8a-debug.apk"
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          BAD_LIBS="$(unzip -Z1 "$APK" | awk '/^lib\// && $0 !~ /^lib\/arm64-v8a\// { print }')"
          test -z "$BAD_LIBS"
          if unzip -Z1 "$APK" | grep -q '^lib/'; then
            unzip -Z1 "$APK" | grep '^lib/'
          else
            echo "no native libs (pure Kotlin/Compose)"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" > /tmp/apk-badging.txt
          grep -E "^(package|application-label|native-code)" /tmp/apk-badging.txt | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skapp-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    # ── 8. 发布：闸门全过 + APK 产物就绪才跑，只做不可逆那一步 ─────────
    # needs 覆盖全部构建/测试 job（含新的 package）：漏一个就等于「测试没跑也能发版」。
    permissions:
      contents: write   # 创建 / 更新 GitHub Release 需要
    needs: [guards, engine-contract, analysis-breadth, analysis-artifacts, engine-tests, compile, ui-render-robolectric, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download APK from package job
        uses: actions/download-artifact@v4
        with:
          name: skapp-apk
          path: dist

      - name: Read version from gradle
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)"
          test -n "$VERSION" && test -n "$CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=skapp-$VERSION-vc$CODE-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (从 package 产物发布，不重新编译)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          SRC="dist/app-arm64-v8a-debug.apk"
          test -f "$SRC"
          NAME="${{ steps.ver.outputs.asset }}"
          SIZE="$(stat -c%s "$SRC")"
          cp "$SRC" "/tmp/$NAME"
          NOTES="$(printf '%s\n' \
            "skapp ${{ steps.ver.outputs.version }} (versionCode ${{ steps.ver.outputs.code }})" \
            "" \
            "- ABI: arm64-v8a only (minSdk 26)" \
            "- Built by ${{ github.workflow }} run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            "- Commit: \`$(echo "$GITHUB_SHA" | cut -c1-7)\`" \
            "- Gates passed: guards -> engine-contract -> analysis -> engine-tests -> compile -> ui-render -> package" \
            "" \
            "Install: sign in to GitHub first — this repo is **private**, anonymous asset URLs return 404. Then tap **$NAME** below to download and install. versionCode increases with every release, so it installs straight over the previous version.")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists -> refresh asset"
            gh release upload "$TAG" "/tmp/$NAME" --clobber
          else
            gh release create "$TAG" "/tmp/$NAME" \
              --title "skapp ${{ steps.ver.outputs.version }} (vc${{ steps.ver.outputs.code }})" \
              --notes "$NOTES" \
              --latest
          fi
          gh release view "$TAG" --json tagName,assets \
            --jq '.tagName, (.assets[] | "\(.name)  \(.size) bytes  \(.url)")'
          echo "APK size: $SIZE bytes"
