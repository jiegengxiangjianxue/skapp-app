name: android-apk

on:
  # 仅手动触发：常规构建与发布由 android-build 负责，避免同一提交重复出包、
  # 以及本工作流固定 tag apk-v0.2.0 覆盖正式发布资产。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          gradle wrapper --gradle-version 8.9 || true
          ./gradlew assembleDebug --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process --info
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Release APK to repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v0.2.0
          files: app/build/outputs/apk/debug/*.apk
          overwrite_files: true
